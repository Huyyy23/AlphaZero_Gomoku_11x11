# Normal Gomoku on 11x11 (5+ in a row wins).
# Values not listed here fall back to DEFAULT_CONFIG in config.py.
rule_set: normal

# Self-play budget: total games = n_iter * games_per_iter
n_iter: 20
games_per_iter: 50

# MCTS
n_simulations: 200
c_puct: 1.5
dirichlet_alpha: 0.15
dirichlet_eps: 0.25
temp_moves: 15

# Replay buffer / trainer
buffer_size: 50000
train_steps_per_iter: 200
batch_size: 128

# Evaluation
arena_win_threshold: 0.55

# Optimisation
learning_rate: 1e-3
optimizer: adam
weight_decay: 1e-4
value_loss_weight: 1.0
policy_loss_weight: 1.0
lr_schedule: cosine
